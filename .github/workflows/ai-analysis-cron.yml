name: AI Analysis Engine

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-ai-analysis:
    name: Run XAUUSD AI Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Trigger AI Analysis Engine
        env:
          AI_URL: "https://trading-ai-platform-81i5.onrender.com/api/ai-analysis?cron=1"
          CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}

        run: |
          set -e

          if [ -z "$CRON_SECRET" ]; then
            echo "ERROR: NEWS_CRON_SECRET is not configured in GitHub Actions secrets."
            exit 1
          fi

          echo "Starting AI Analysis Engine..."

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            -H "x-ai-cron-secret: ${CRON_SECRET}" \
            "${AI_URL}")

          echo "AI Analysis response:"
          echo "$RESPONSE"

          echo "AI Analysis Engine completed successfully."
